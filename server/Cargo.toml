[package]
name = "gitdaemon"
version = "0.1.0"
edition = "2021"
description = "Local git daemon exposing the git workflow as JSON-RPC over HTTP + WebSocket"
license = "MIT"

[[bin]]
name = "gitdaemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors", "fs"] }

[profile.release]
debug = false
